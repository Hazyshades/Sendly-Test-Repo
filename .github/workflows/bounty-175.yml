name: Bounty 175 verification

on:
  push:
    branches:
      - 'bounty/fix-175-upload-endpoint'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version: file:.nvmrc
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run JavaScript acceptance tests
        run: npm run test:js
      - name: Run the Python CLI suite
        run: npm run test:py
      - name: Verify endpoint normalization and blank URL guard
        run: |
          grep -F "const endpoint = uploadUrl?.trim() ?? '';" lib/useFileUpload.ts
          grep -F "if (!endpoint)" lib/useFileUpload.ts
          grep -F "fetch(endpoint" lib/useFileUpload.ts
